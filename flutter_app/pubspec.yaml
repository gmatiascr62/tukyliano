name: tukyliano
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  path_provider: ^2.1.6
  flutter_tts: ^4.2.5
  # Abre el navegador en la página donde se saca la clave de la IA.
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  speech_to_text: ^7.4.0
  # Reproduce los episodios grabados: archivo de audio en vez del motor de voz.
  just_audio: ^0.10.5
  # El servicio de Android que deja seguir sonando con la pantalla bloqueada.
  # Se usa directo y no a través de just_audio_background: ese hace lo mismo
  # con tres renglones, pero lleva años en beta y acá no andaba —el servicio
  # arrancaba, el audio sonaba y la notificación no aparecía nunca—, fallando
  # en silencio y sin dónde mirar. Su propio README recomienda este camino
  # para todo lo que no sea el caso más simple.
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Copia de respaldo de los verbos, la misma que empaqueta la app Kivy.
  # Se usa la primera vez que arranca y cuando no hay internet.
  assets:
    - assets/verbos.json
    - assets/frases.json
    - assets/articoli.json
    - assets/preposizioni.json
    - assets/via.json
    - assets/racconti.json
    # El camino: las ciudades y sus lecciones, con los dibujos de cada una.
    - assets/percorso.json
    - assets/camino/
    # Las fotos del viaje del perrito: una cada dos lecciones.
    - assets/album/
    - assets/podcast.json
    # El catálogo de las fábulas: títulos y duraciones, nada más. Los audios
    # NO van acá —son 17 MB el primer libro— y se bajan cuando se tocan.
    - assets/favole.json

    # Los treinta y seis capítulos de Pinocchio, con su texto. El audio no
    # viaja acá: se baja al tocarlo, como el de las fábulas. Son 132 MB.
    - assets/pinocchio.json
    # Las emisoras italianas en vivo. Es un archivo y no código porque las
    # direcciones de los streams las cambian las emisoras sin avisar.
    - assets/radios.json
    # El diccionario italiano-español. Ver "Acerca de" en la app: es de
    # FreeDict/WikDict y va con licencia CC BY-SA 3.0, que pide dar el
    # crédito. El archivo lo arma scripts/armar_diccionario.py.
    - assets/diccionario.json

    # De qué palabra viene cada forma conjugada: "abbia" → "avere". Va
    # aparte del diccionario porque pesa casi lo mismo que él. Es de
    # Wiktionary vía kaikki.org y también pide crédito. Lo arma
    # scripts/armar_formas.py.
    - assets/formas.json
    # Las ilustraciones de los cuentos. Van en el APK y no se bajan: son pocas
    # y chicas, y así el cuento se ve igual sin señal.
    - assets/racconti/
    # Los episodios del podcast grabados con voz de verdad. Son 7 MB los tres,
    # y van adentro del APK a propósito: se escuchan sin internet y sin gastar
    # datos, que es justo cómo se escucha un podcast. Si algún día son
    # cuarenta episodios habrá que bajarlos a demanda.
    - assets/audio/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Ícono de la app, generado a partir de la misma imagen que usa la versión
# Kivy. Se regenera con: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 21

# Pantalla de carga, también con la imagen de la versión Kivy. El color de
# fondo es el mismo que Window.clearcolor. Se regenera con:
# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F5F7F2"
  image: assets/presplash.png
  android: true
  ios: false
  android_12:
    color: "#F5F7F2"
    image: assets/presplash.png
