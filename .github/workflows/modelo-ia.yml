# Mira la ficha del modelo de IA en Hugging Face y la compara con lo que dice
# el código. Si quien lo publica subiera otro archivo con el mismo nombre, la
# app se bajaría algo distinto de lo que esperamos: esto lo detecta acá.
#
# Correrlo a mano (workflow_dispatch) sirve para averiguar el tamaño y el
# SHA-256 cuando se cambia de modelo.
name: Modelo de IA

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repositorios de Hugging Face a mirar, separados por coma'
        default: 'Qwen/Qwen3-0.6B-GGUF,ggml-org/Qwen3-0.6B-GGUF,unsloth/Qwen3-0.6B-GGUF'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/modelo-ia.yml'
      - 'flutter_app/lib/ia/modelo.dart'

jobs:
  ficha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Listar los modelos publicados
        env:
          REPOS: ${{ github.event.inputs.repos || 'Qwen/Qwen3-0.6B-GGUF' }}
        run: |
          # El tamaño y el SHA-256 salen del puntero LFS, que es un archivo de
          # texto de tres renglones y no necesita bajarse el modelo entero.
          for repo in ${REPOS//,/ }; do
            echo "=============== $repo"
            revision=$(curl -sS "https://huggingface.co/api/models/$repo" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])")
            echo "revision: $revision"
            curl -sS "https://huggingface.co/api/models/$repo" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('licencia:', (d.get('cardData') or {}).get('license'))"
            curl -sS "https://huggingface.co/api/models/$repo/tree/main?recursive=true" \
              | python3 -c "
          import json, sys
          for f in json.load(sys.stdin):
              if f['path'].endswith('.gguf'):
                  print(f['path'])
          " > archivos.txt
            while read -r archivo; do
              puntero=$(curl -sSL "https://huggingface.co/$repo/raw/$revision/$archivo")
              oid=$(echo "$puntero" | sed -n 's/^oid sha256://p')
              bytes=$(echo "$puntero" | sed -n 's/^size //p')
              megas=$(( ${bytes:-0} / 1048576 ))
              echo "  $archivo"
              echo "     bytes  = $bytes  ($megas MB)"
              echo "     sha256 = $oid"
            done < archivos.txt
          done

      - name: Comparar con lo que dice el código
        run: |
          ARCHIVO=flutter_app/lib/ia/modelo.dart
          [ -f "$ARCHIVO" ] || { echo "Todavía no existe $ARCHIVO: solo informo la ficha."; exit 0; }
          python3 - <<'PY'
          import json, re, sys, urllib.request

          codigo = open('flutter_app/lib/ia/modelo.dart', encoding='utf-8').read()

          def constante(nombre):
              # Los guiones bajos se sacan solo de los números (396_705_472);
              # en un nombre de archivo son parte del nombre y sacarlos deja
              # una URL que no existe.
              texto = re.search(rf"{nombre}\s*=\s*'([^']*)'", codigo)
              if texto:
                  return texto.group(1)
              numero = re.search(rf"{nombre}\s*=\s*([0-9_]+)", codigo)
              return numero.group(1).replace('_', '') if numero else None

          repo = constante('repositorioDelModelo')
          archivo = constante('nombreDelModelo')
          revision = constante('revisionDelModelo')

          puntero = urllib.request.urlopen(
              f'https://huggingface.co/{repo}/raw/{revision}/{archivo}'
          ).read().decode()
          real = dict(
              sha256DelModelo=re.search(r'oid sha256:(\w+)', puntero).group(1),
              bytesDelModelo=re.search(r'size (\d+)', puntero).group(1),
          )

          males = [
              f'  {nombre}: el código dice "{constante(nombre)}" y es "{valor}"'
              for nombre, valor in real.items()
              if constante(nombre) != valor
          ]
          if males:
              sys.exit('ERROR: la ficha del modelo no coincide:\n' + '\n'.join(males))
          print(f'El modelo que se baja ({repo}/{archivo}) es el que dice el código.')
          PY
