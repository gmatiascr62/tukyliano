# Baja el modelo de verdad y lo hace contestar, con la misma versión de
# llama.cpp que lleva el APK.
#
# Cuando el chat no arranca en un celular, el que falla es código nativo y sus
# mensajes no se ven. Acá sí se ven: si el modelo carga y contesta en esta
# prueba, el archivo y la versión de la biblioteca están bien y el problema es
# de Android; si no carga, el error completo queda en el log.
name: Probar el modelo

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probar-modelo.yml'
      - 'herramientas/**'
      - 'flutter_app/lib/ia/modelo.dart'

jobs:
  probar:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.datos.outputs.commit }}
      url: ${{ steps.datos.outputs.url }}
      sha: ${{ steps.datos.outputs.sha }}
      bytes: ${{ steps.datos.outputs.bytes }}
    steps:
      - uses: actions/checkout@v4

      - name: Averiguar qué versión y qué modelo usa el APK
        id: datos
        run: |
          set -euo pipefail
          # Los mismos valores que usa el build, sacados de donde están
          # escritos, para que esta prueba no quede probando otra cosa.
          COMMIT=$(sed -n "s/.*LLAMA_COMMIT: *'\([0-9a-f]*\)'.*/\1/p" \
            .github/workflows/build-apk-flutter.yml | head -1)
          [ -n "$COMMIT" ] || { echo "ERROR: no encontré LLAMA_COMMIT."; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "llama.cpp: $COMMIT"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          codigo = open('flutter_app/lib/ia/modelo.dart', encoding='utf-8').read()
          def constante(nombre):
              # Los guiones bajos se sacan solo de los números (396_705_472);
              # en un nombre de archivo son parte del nombre y sacarlos deja
              # una URL que no existe.
              texto = re.search(rf"{nombre}\s*=\s*'([^']*)'", codigo)
              if texto:
                  return texto.group(1)
              return re.search(rf"{nombre}\s*=\s*([0-9_]+)", codigo).group(1).replace('_', '')
          for salida, nombre in [
              ('url', 'urlDelModelo'),
              ('sha', 'sha256DelModelo'),
              ('bytes', 'bytesDelModelo'),
          ]:
              valor = constante(nombre)
              if salida == 'url':
                  # La URL está armada con las otras constantes.
                  valor = (f"https://huggingface.co/{constante('repositorioDelModelo')}"
                           f"/resolve/{constante('revisionDelModelo')}"
                           f"/{constante('nombreDelModelo')}")
              print(f'{salida}={valor}')
          PY
          cat "$GITHUB_OUTPUT"

      - name: Compilar llama.cpp
        env:
          LLAMA_COMMIT: ${{ steps.datos.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/llama.cpp
          git -C /tmp/llama.cpp init -q
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C /tmp/llama.cpp fetch -q --depth 1 origin "$LLAMA_COMMIT"
          git -C /tmp/llama.cpp checkout -q FETCH_HEAD

          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF
          cmake --build /tmp/llama-build --target llama -j"$(nproc)"

      - name: Compilar la prueba
        run: |
          set -euo pipefail
          cc herramientas/probar_modelo.c \
            -I /tmp/llama.cpp/include -I /tmp/llama.cpp/ggml/include \
            -L /tmp/llama-build/bin -lllama \
            -Wl,-rpath,/tmp/llama-build/bin \
            -o /tmp/probar_modelo

      - name: Guardar el modelo entre corridas
        id: guardado
        uses: actions/cache@v4
        with:
          path: /tmp/modelo.gguf
          key: modelo-${{ steps.datos.outputs.sha }}

      - name: Bajar el modelo
        if: steps.guardado.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.datos.outputs.url }}
        # --fail: sin eso, un 404 se guarda como si fuera el modelo y el error
        # aparece mucho más adelante, disfrazado de archivo corrupto.
        run: curl -fsSL -o /tmp/modelo.gguf "$URL"

      - name: Ver que sea el archivo que espera la app
        env:
          SHA: ${{ steps.datos.outputs.sha }}
          BYTES: ${{ steps.datos.outputs.bytes }}
        run: |
          set -euo pipefail
          echo "bytes: $(stat -c%s /tmp/modelo.gguf) (se esperaban $BYTES)"
          echo "$SHA  /tmp/modelo.gguf" | sha256sum -c -

      - name: Cargar el modelo y hacerlo contestar
        # La plantilla la trae el archivo del modelo: es la forma exacta en la
        # que fue entrenado para recibir una charla. Mejor copiarla que
        # adivinarla.
        env:
          PLANTILLA: '1'
        run: /tmp/probar_modelo /tmp/modelo.gguf

      # Las instrucciones salen del código, y las de al lado son candidatas
      # para comparar contra ellas. Cada una se corre con las escenas de
      # herramientas/escenas: charlas de varios turnos, porque los problemas
      # que aparecen —cambiar de tema, inventar correcciones— no se ven con un
      # solo mensaje.
      - name: Probar formas de darle las instrucciones
        run: |
          set -eu

          # Las instrucciones que de verdad corren en el celular salen del
          # código, no de una copia: una copia se desactualiza y entonces la
          # prueba queda probando otra cosa.
          mkdir -p herramientas/prompts
          python3 - <<'PY' > herramientas/prompts/0-el-del-codigo.txt
          import re
          codigo = open('flutter_app/lib/ia/chat.dart', encoding='utf-8').read()
          print(re.search(r"const String promptDeChat = \'\'\'\n(.*?)\'\'\'", codigo, re.S).group(1))
          PY

          # Las instrucciones que de verdad corren en el celular salen del
          # código, no de una copia: una copia se desactualiza y entonces la
          # prueba queda probando otra cosa. Las de al lado son alternativas
          # para comparar contra esta.
          python3 - <<'PY' > herramientas/prompts/0-el-del-codigo.txt
          import re
          codigo = open('flutter_app/lib/ia/chat.dart', encoding='utf-8').read()
          print(re.search(r"const String promptDeChat = '''\n(.*?)'''", codigo, re.S).group(1))
          PY

          for reglas in herramientas/prompts/*.txt; do
            for escena in herramientas/escenas/*.txt; do
              # Cada renglón de la escena es un turno: "quien: lo que dijo".
              python3 - "$reglas" "$escena" > /tmp/prompt.txt <<'ARMAR'
          import sys
          reglas = open(sys.argv[1], encoding='utf-8').read().rstrip('\n')
          partes = [f'<|im_start|>system\n{reglas}<|im_end|>\n']
          for linea in open(sys.argv[2], encoding='utf-8'):
              linea = linea.rstrip('\n')
              if not linea.strip():
                  continue
              quien, _, dicho = linea.partition(': ')
              partes.append(f'<|im_start|>{quien}\n{dicho}<|im_end|>\n')
          partes.append('<|im_start|>assistant\n')
          sys.stdout.write(''.join(partes))
          ARMAR

              echo "=================================================="
              echo "===== $(basename "$reglas" .txt)  en  $(basename "$escena" .txt)"
              tail -1 "$escena"
              /tmp/probar_modelo /tmp/modelo.gguf /tmp/prompt.txt \
                | grep -v '^OK: \|^== sistema\|^== cargando' || true
            done
          done

  # Lo mismo, pero adentro de un Android. Es donde falla de verdad, y acá sí
  # se lee todo lo que llama.cpp tiene para decir.
  #
  # El emulador es x86_64 y el celular es arm64: no es lo mismo, pero el
  # cargador de Android, la biblioteca de C del sistema y el formato del
  # archivo sí son los mismos. Si acá falla, el motivo vale.
  en-android:
    runs-on: ubuntu-latest
    needs: probar
    steps:
      - uses: actions/checkout@v4

      - name: Compilar llama.cpp para Android
        env:
          LLAMA_COMMIT: ${{ needs.probar.outputs.commit }}
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          [ -n "$NDK" ] || { echo "ERROR: no hay NDK en el runner."; exit 1; }
          echo "NDK: $NDK"

          mkdir -p /tmp/llama.cpp
          git -C /tmp/llama.cpp init -q
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C /tmp/llama.cpp fetch -q --depth 1 origin "$LLAMA_COMMIT"
          git -C /tmp/llama.cpp checkout -q FETCH_HEAD

          # Las mismas banderas que usa el APK, salvo la arquitectura: el
          # emulador es x86_64.
          cmake -S /tmp/llama.cpp -B /tmp/llama-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          cmake --build /tmp/llama-android --target llama -j"$(nproc)"

          mkdir -p /tmp/al-celular
          find /tmp/llama-android -name '*.so' -exec cp -v {} /tmp/al-celular/ \;

          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang \
            herramientas/probar_modelo.c \
            -I /tmp/llama.cpp/include -I /tmp/llama.cpp/ggml/include \
            -L /tmp/al-celular -lllama \
            -o /tmp/al-celular/probar_modelo
          ls -lh /tmp/al-celular

      - name: Guardar el modelo entre corridas
        id: guardado
        uses: actions/cache@v4
        with:
          path: /tmp/modelo.gguf
          key: modelo-${{ needs.probar.outputs.sha }}

      - name: Bajar el modelo
        if: steps.guardado.outputs.cache-hit != 'true'
        env:
          URL: ${{ needs.probar.outputs.url }}
        run: curl -fsSL -o /tmp/modelo.gguf "$URL"

      - name: Dejar que el emulador use el procesador de verdad
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cargar el modelo adentro de Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Ojo: este script lo corre sh, no bash. Nada de pipefail acá.
          script: |
            set -eu
            adb push /tmp/al-celular/. /data/local/tmp/
            adb push /tmp/modelo.gguf /data/local/tmp/modelo.gguf
            adb shell chmod 755 /data/local/tmp/probar_modelo
            adb shell "ls -l /data/local/tmp"
            adb shell "cd /data/local/tmp && LD_LIBRARY_PATH=/data/local/tmp ./probar_modelo modelo.gguf"
