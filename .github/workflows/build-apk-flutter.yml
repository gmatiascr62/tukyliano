name: Build APK Flutter

# Convive con build-apk.yml (la app Kivy) durante la migración.
# Cada workflow solo corre cuando cambia lo suyo, así un cambio en Flutter
# no dispara el build de buildozer, que tarda ~20 minutos.
on:
  push:
    branches: [ main ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk-flutter.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Para poder publicar la Release con el APK adjunto.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # La firma de verdad, sin la cual Android no deja actualizar la app
      # encima de la instalada. El archivo se arma acá a partir del secreto y
      # nunca queda en el repo, que es público. Si el secreto todavía no está
      # cargado, el build sigue con la firma de debug.
      - name: Preparar la firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/tukyliano.jks
            echo "propia=si" >> "$GITHUB_OUTPUT"
            echo "Firma propia lista."
          else
            echo "propia=no" >> "$GITHUB_OUTPUT"
            echo "Sin KEYSTORE_BASE64: se firma con la de debug."
          fi

      # Con reintentos porque pub.dev a veces contesta 403 al pedirle los
      # avisos de seguridad de los paquetes, y eso tira el build entero sin
      # que haya nada roto de este lado.
      - name: Bajar dependencias
        run: |
          for intento in 1 2 3; do
            if flutter pub get; then exit 0; fi
            echo "pub get falló (intento $intento). Reintentando en 15s..."
            sleep 15
          done
          echo "ERROR: pub get falló tres veces."
          exit 1

      - name: Revisar el código
        run: flutter analyze --no-pub

      # El motor de IA que corre adentro del celular. El paquete de Dart trae
      # solo los bindings: la biblioteca nativa hay que compilarla, y se hace
      # acá para que viaje adentro del APK.
      #
      # Solo arm64-v8a: es lo que tiene cualquier celular de los últimos ocho
      # años. Un ARM de 32 bits no tiene memoria para un modelo de 400 MB, así
      # que compilarlo también para esos sería duplicar el build para nada.
      #
      # Sin GPU y sin OpenMP: la GPU de un celular común no ayuda con un modelo
      # de este tamaño y las bibliotecas no están en todos los aparatos. Todo
      # por procesador, que es lo que anda en todos lados.
      - name: Compilar llama.cpp para Android
        working-directory: .
        env:
          # El commit exacto contra el que están generados los bindings del
          # paquete de Dart: lo dice su propio pubspec.yaml, en el comentario
          # al lado de la versión.
          #
          # No es un detalle: los bindings llaman a las funciones de llama.cpp
          # pasándoles estructuras de C. Si la biblioteca es de otra versión y
          # alguna de esas estructuras cambió —aunque sea un campo— lo que se
          # le pasa no es lo que espera y el proceso se muere de una, sin
          # error que mostrar. Compilar "la última" fue exactamente eso: el
          # APK v1.0.78 cerraba la app al abrir el chat.
          LLAMA_COMMIT: '4ffc47cb2001e7d523f9ff525335bbe34b1a2858'
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          [ -n "$NDK" ] || { echo "ERROR: no hay NDK en el runner."; exit 1; }
          echo "NDK: $NDK"
          grep -m1 "Pkg.Revision" "$NDK/source.properties" || true

          echo "COMMIT DE LLAMA.CPP: $LLAMA_COMMIT"

          # Por commit y no por tag, así que se baja a mano en vez de clonar.
          mkdir -p /tmp/llama.cpp
          git -C /tmp/llama.cpp init -q
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C /tmp/llama.cpp fetch -q --depth 1 origin "$LLAMA_COMMIT"
          git -C /tmp/llama.cpp checkout -q FETCH_HEAD

          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          # Solo las dos bibliotecas que se usan. Compilar todo tarda el doble
          # y termina fallando al linkear el ejecutable de consola, que acá no
          # le sirve a nadie.
          cmake --build /tmp/llama-build --target llama -j"$(nproc)"
          cmake --build /tmp/llama-build --target mtmd -j"$(nproc)" \
            || echo "Sin mtmd: con libllama.so alcanza para charlar."

          DESTINO=flutter_app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DESTINO"
          find /tmp/llama-build -name '*.so' -exec cp -v {} "$DESTINO/" \;

          echo "Bibliotecas que van en el APK:"
          ls -lh "$DESTINO"
          # Android 15 en adelante, en varios celulares, usa páginas de 16 KB:
          # una biblioteca alineada a 4 KB ahí no abre, y el error que se ve
          # desde Dart es que el isolate no contesta nunca.
          echo "Alineación (tiene que decir 2**14 = 16 KB):"
          LEER="$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for lib in "$DESTINO"/*.so; do
            # Sin "exit" en el awk: si se corta la lectura, llvm-readelf se
            # queda escribiendo en una tubería cerrada, termina con código 74
            # y el build se cae por el aviso en vez de por la compilación.
            alineacion=$("$LEER" -l "$lib" | awk '/LOAD/ && !visto {print $NF; visto=1}')
            echo "  $(basename "$lib"): ${alineacion:-sin dato}"
          done
          # Sin esta no hay chat: es la que abre el paquete de Dart.
          test -f "$DESTINO/libmtmd.so" || test -f "$DESTINO/libllama.so" \
            || { echo "ERROR: no se compiló ni libmtmd.so ni libllama.so"; exit 1; }
        id: llama

      # Release en vez de debug: el APK pasa de ~160 MB a ~25 MB.
      #
      # El número de build es el del workflow, que siempre sube. Es lo que mira
      # Android para saber si un APK es más nuevo que el instalado, y lo que
      # mira la app para avisar que hay una versión nueva. Va también por
      # dart-define para que el código pueda leerlo.
      - name: Build APK
        env:
          TUKYLIANO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --no-pub \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD=${{ github.run_number }}

      # La plantilla de Flutter pone el permiso de INTERNET solo en los
      # manifests de debug y profile. Ya pasó una vez que el APK de release
      # saliera sin internet; esto lo detecta acá en vez de en el celular.
      - name: Verificar que el APK tenga permiso de internet
        run: |
          MANIFEST=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            MANIFEST=$(find build/app/intermediates -name AndroidManifest.xml -path '*release*' | head -1)
          fi
          echo "Manifest: $MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" \
            || { echo "ERROR: el APK de release no declara INTERNET"; exit 1; }

      # Sin esto el archivo se llama "app-release.apk" en Descargas.
      - name: Renombrar el APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Tukyliano.apk

      # De esto depende que la app se pueda actualizar: Android solo instala
      # encima si la firma es la misma de siempre. Si alguien regenerara el
      # keystore, cada actualización empezaría a fallar en el celular sin que
      # nada acá se quejara. La huella no es un secreto: viene adentro de todos
      # los APK publicados.
      - name: Verificar que la firma sea la de siempre
        if: steps.firma.outputs.propia == 'si'
        run: |
          ESPERADA="998e217186e4095d3500e6dbad5a0a58215355b1b0a3fbcba11e0d72abd4f57a"

          # apksigner entiende las firmas v2 y v3, que son las que usa Android
          # moderno. keytool solo lee la v1, así que queda de respaldo.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          HUELLA=""
          if [ -n "$APKSIGNER" ]; then
            HUELLA=$("$APKSIGNER" verify --print-certs Tukyliano.apk \
              | grep -m1 -i 'SHA-256 digest' | awk '{print $NF}')
          fi
          if [ -z "$HUELLA" ]; then
            HUELLA=$(keytool -printcert -jarfile Tukyliano.apk 2>/dev/null \
              | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          fi

          if [ -z "$HUELLA" ]; then
            echo "ERROR: no se pudo leer la firma del APK."
            exit 1
          fi
          echo "Firma del APK: $HUELLA"
          if [ "$HUELLA" != "$ESPERADA" ]; then
            echo "ERROR: el APK está firmado con otra clave."
            echo "Se esperaba: $ESPERADA"
            echo "Con esta firma no se puede instalar encima de la que ya está"
            echo "instalada en el celular."
            exit 1
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tukyliano-flutter-apk
          path: flutter_app/Tukyliano.apk

      # La Release es de donde la app se baja la actualización: el artefacto de
      # arriba pide estar logueado en GitHub y se borra a los 90 días, así que
      # no sirve para eso.
      #
      # Solo se publica si el APK va firmado con la clave propia. Uno firmado
      # con la de debug no se puede instalar encima del anterior, así que
      # ofrecerlo como actualización sería mandar al usuario a un callejón.
      - name: Publicar la Release
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.firma.outputs.propia == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Tukyliano.apk \
            --repo "${{ github.repository }}" \
            --title "Tukyliano 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)"
