name: Build APK Flutter

# Convive con build-apk.yml (la app Kivy) durante la migración.
# Cada workflow solo corre cuando cambia lo suyo, así un cambio en Flutter
# no dispara el build de buildozer, que tarda ~20 minutos.
on:
  push:
    branches: [ main ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk-flutter.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bajar dependencias
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze

      # Release en vez de debug: el APK pasa de ~160 MB a ~25 MB. Se firma con
      # la clave de debug (ver android/app/build.gradle.kts), así que se
      # instala igual sin tener que generar un keystore.
      - name: Build APK
        run: flutter build apk --release

      # Sin esto el archivo se llama "app-release.apk" en Descargas.
      - name: Renombrar el APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Tukyliano.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tukyliano-flutter-apk
          path: flutter_app/Tukyliano.apk
